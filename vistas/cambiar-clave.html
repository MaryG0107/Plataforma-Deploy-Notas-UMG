<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cambiar contraseña — Plataforma de notas</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/portal.css">
  <link rel="stylesheet" href="assets/css/acceso.css">
  <script src="assets/js/comun.js" defer></script>
  <script src="assets/js/cambiar-clave.js" defer></script>
</head>
<body class="pagina-acceso fondo-marca">
  <main class="login">
    <form class="login__caja" id="form-clave" data-al-terminar="recargar" novalidate>
      <p class="login__etiqueta">Primer ingreso</p>
      <h1>Cambiá tu contraseña</h1>
      <p class="login__sub">Estás usando una contraseña temporal. Elegí una nueva de al menos 12 caracteres para continuar.</p>
      <div class="campo">
        <label for="clave-actual">Contraseña temporal</label>
        <input id="clave-actual" name="actual" type="password" autocomplete="current-password" required maxlength="200">
      </div>
      <div class="campo">
        <label for="clave-nueva">Nueva contraseña</label>
        <input id="clave-nueva" name="nueva" type="password" autocomplete="new-password" required minlength="12" maxlength="200">
      </div>
      <div class="campo">
        <label for="clave-repetir">Repetir nueva contraseña</label>
        <input id="clave-repetir" name="repetir" type="password" autocomplete="new-password" required minlength="12" maxlength="200">
      </div>
      <p class="mensaje" id="mensaje" role="alert"></p>
      <button class="boton boton--rojo boton--ancho" type="submit">Guardar y continuar</button>
      <p class="login__volver"><button class="enlace" type="button" id="btn-salir">Cerrar sesión</button></p>
    </form>
  </main>
</body>
</html>
